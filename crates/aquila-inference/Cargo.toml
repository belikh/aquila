[package]
name = "aquila-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aquila-types = { path = "../aquila-types" }
serde = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
# The ONNX Runtime adapters (`OnnxPoseModel`/`OnnxVitalsModel`). Off by default:
# the `ort` dependency is deliberately not pulled yet, so the gated adapters
# fail closed at load. See `inference-models.md` §3.2 and `src/onnx.rs`.
onnx = []
# Optional execution providers for `DeviceSelection`. Not required for v1.
cuda = []
openvino = []

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
