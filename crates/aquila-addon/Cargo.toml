[package]
name = "aquila-addon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Aquila composition root: wires the sensing core to the loopback API."

[dependencies]
aquila-types = { path = "../aquila-types" }
aquila-geometry = { path = "../aquila-geometry" }
aquila-wire = { path = "../aquila-wire" }
aquila-sources = { path = "../aquila-sources" }
aquila-simulator = { path = "../aquila-simulator" }
aquila-sensing = { path = "../aquila-sensing" }
aquila-metrics = { path = "../aquila-metrics" }
aquila-api = { path = "../aquila-api" }
# Safe Unix signal handling for the container's SIGTERM/SIGINT stop contract
# (`home-assistant.md`): the `signal` feature provides `SigSet`/`sigwait` without
# any `unsafe` in this crate.
nix = { version = "0.31", default-features = false, features = ["signal"] }

[lints]
workspace = true
