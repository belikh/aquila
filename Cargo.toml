[workspace]
resolver = "2"
members = [
    "crates/aquila-types",
    "crates/aquila-wire",
    "crates/aquila-signal",
    "crates/aquila-geometry",
    "crates/aquila-metrics",
    "crates/aquila-session",
    "crates/aquila-inference",
    "crates/aquila-sources",
    "crates/aquila-simulator",
    "crates/aquila-sensing",
    "crates/aquila-evaluation",
    "crates/aquila-testkit",
    "crates/aquila-capture",
    "crates/aquila-ha",
    "crates/aquila-api",
    "crates/aquila-addon",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes JSON float parsing exact, so a content-addressed
# artefact (the `aquila.calibration/v1` document) round-trips bit-for-bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
proptest = "1"
approx = "0.5"
# The one SHA-256 implementation for the whole workspace, owned by
# `aquila-types` (audit #13). Version chosen to match the provisioned registry
# cache (0.11.x); the digest API is unchanged.
sha2 = "0.11"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
