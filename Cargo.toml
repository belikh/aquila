[workspace]
resolver = "2"
members = [
    "crates/aquila-types",
    "crates/aquila-wire",
    "crates/aquila-signal",
    "crates/aquila-geometry",
    "crates/aquila-metrics",
    "crates/aquila-session",
    "crates/aquila-inference",
    "crates/aquila-sources",
    "crates/aquila-simulator",
    "crates/aquila-sensing",
    "crates/aquila-evaluation",
    "crates/aquila-testkit",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
approx = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
