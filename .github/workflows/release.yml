# Release automation for Aquila (repository-tooling.md §10.4, §12;
# home-assistant.md §3.1, §3.3, §9).
#
# Runs on annotated `v*` tags. Builds and pushes the multi-arch add-on image to
# GHCR, builds the dashboard WASM bundle, packages the HACS component as
# `aquila.zip`, writes checksums, attests provenance and attaches the assets to
# the GitHub release.
#
# Honesty gate: this workflow packages and publishes; it does NOT declare v1
# shipped. The v1 accuracy bars are hardware-gated and remain `target` in
# `claims.toml` until commit-keyed ledger rows back them (roadmap, "What v1
# shipped means"). Do not create a `v1.0.0` tag until those gates pass.
#
# Third-party actions are pinned to a full commit SHA with the tag in a trailing
# comment (repository-tooling.md §10). Dependabot updates them.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # release assets
  packages: write # ghcr.io
  id-token: write # build provenance attestation
  attestations: write

jobs:
  dashboard:
    name: dashboard (trunk wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build dashboard bundle
        run: nix develop --command bash -c 'cd crates/aquila-dashboard && trunk build --release'
      - name: Package dashboard bundle
        run: |
          find crates/aquila-dashboard/dist -exec touch -t 198001010000.00 {} +
          ( cd crates/aquila-dashboard && find dist -type f -print | LC_ALL=C sort \
              | zip -X -q -9 "$GITHUB_WORKSPACE/aquila-dashboard.zip" -@ )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aquila-dashboard
          path: aquila-dashboard.zip
          if-no-files-found: error

  image:
    name: add-on image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base-debian:bookworm@sha256:7da3f90a8e2fdc3095cc93b0dfb751c9c21356e11b30a6493c7ac15270b4e809
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base-debian:bookworm@sha256:68f4c1a11d10facc5442ff11509a164463f98b154c80dc1dfeedbc267dd71665
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read add-on version
        id: ver
        run: echo "version=$(awk '/^version:/{print $2}' aquila_core/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Build and push add-on image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: aquila_core/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            AQUILA_VERSION=${{ github.ref_name }}
            AQUILA_COMMIT=${{ github.sha }}
          # Supervisor pulls the image tag equal to the add-on `version`
          # (aquila_core/config.yaml); it is read above so the two cannot drift.
          tags: |
            ghcr.io/belikh/aquila-core-${{ matrix.arch }}:${{ github.ref_name }}
            ghcr.io/belikh/aquila-core-${{ matrix.arch }}:${{ steps.ver.outputs.version }}
            ghcr.io/belikh/aquila-core-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=addon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=addon-${{ matrix.arch }}
          provenance: true
          sbom: true

  release:
    name: package and attach release assets
    # The HACS zip only needs the dashboard build; do not gate it on the slow
    # multi-arch image build (aarch64 runs under QEMU).
    needs: [dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aquila-dashboard
      - name: Package HACS component (aquila.zip)
        run: tools/package-hacs.sh
      - name: Checksums
        run: sha256sum aquila.zip aquila-dashboard.zip > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            aquila.zip
            aquila-dashboard.zip
      - name: Attach assets to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            aquila.zip
            aquila-dashboard.zip
            SHA256SUMS
