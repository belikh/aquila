<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620" width="850" height="620" font-family="Arial,Helvetica,sans-serif" font-size="10">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#000"/></marker>
  </defs>
  <rect x="10" y="10" width="830" height="600" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="425" y="28" text-anchor="middle" font-size="13" font-weight="bold">Fig. 3</text>
  <text x="425" y="44" text-anchor="middle" font-size="11">phase model of a single directed link T&#8594;R (subcarrier k)</text>

  <!-- Transmitter and receiver -->
  <g transform="translate(180,260)">
    <circle r="24" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="0" y="5" text-anchor="middle" font-weight="bold">T</text>
    <text x="0" y="38" text-anchor="middle" font-size="8">transmitter</text>
  </g>
  <g transform="translate(670,260)">
    <circle r="24" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="0" y="5" text-anchor="middle" font-weight="bold">R</text>
    <text x="0" y="38" text-anchor="middle" font-size="8">receiver</text>
  </g>

  <!-- Link -->
  <line x1="204" y1="260" x2="646" y2="260" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="425" y="246" text-anchor="middle" font-size="9">directed link T&#8594;R</text>
  <text x="425" y="260" text-anchor="middle" font-size="8">path length d<sub>T&#8594;R</sub></text>

  <!-- Phase components stacked at top -->
  <g transform="translate(150,60)">
    <rect x="0" y="0" width="550" height="150" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="275" y="20" text-anchor="middle" font-weight="bold">measured phase &#966;<sub>T&#8594;R</sub>[k] decomposes into</text>
    <line x1="20" y1="36" x2="530" y2="36" stroke="#000" stroke-width="0.8"/>
    <text x="40" y="56" text-anchor="start" font-size="9">&#952;<sub>T</sub> &#8212; transmitter local-oscillator phase</text>
    <text x="40" y="76" text-anchor="start" font-size="9">&#952;<sub>R</sub> &#8212; receiver local-oscillator phase</text>
    <text x="40" y="96" text-anchor="start" font-size="9">&#8722;(2&#960; f<sub>k</sub> / c) &#8226; d<sub>T&#8594;R</sub> &#8212; propagation phase</text>
    <text x="40" y="116" text-anchor="start" font-size="9">&#916;<sub>scatterer</sub>[k] &#8212; perturbation from moving scatterer</text>
    <text x="40" y="136" text-anchor="start" font-size="9">+ noise</text>
  </g>
</svg>