<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620" width="850" height="620" font-family="Arial,Helvetica,sans-serif" font-size="10">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#000"/></marker>
  </defs>
  <rect x="10" y="10" width="830" height="600" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="425" y="28" text-anchor="middle" font-size="13" font-weight="bold">Fig. 4</text>
  <text x="425" y="44" text-anchor="middle" font-size="11">closure phase vs. subcarrier frequency (slope &#8776; effective loop path length)</text>

  <!-- Plot area -->
  <rect x="150" y="120" width="540" height="330" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <line x1="150" y1="450" x2="690" y2="450" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="150" y1="450" x2="150" y2="120" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="420" y="490" text-anchor="middle" font-size="9">subcarrier frequency f<sub>k</sub></text>
  <text x="60" y="285" text-anchor="middle" font-size="9" transform="rotate(-90 60 285)">closure phase &#932;[k] (rad)</text>

  <!-- Ticks -->
  <line x1="150" y1="450" x2="150" y2="456" stroke="#000" stroke-width="1"/>
  <line x1="420" y1="450" x2="420" y2="456" stroke="#000" stroke-width="1"/>
  <line x1="690" y1="450" x2="690" y2="456" stroke="#000" stroke-width="1"/>
  <text x="150" y="470" text-anchor="middle" font-size="8">f<sub>lo</sub></text>
  <text x="420" y="470" text-anchor="middle" font-size="8">f<sub>center</sub></text>
  <text x="690" y="470" text-anchor="middle" font-size="8">f<sub>hi</sub></text>
  <line x1="144" y1="450" x2="150" y2="450" stroke="#000" stroke-width="1"/>
  <line x1="144" y1="285" x2="150" y2="285" stroke="#000" stroke-width="1"/>
  <line x1="144" y1="120" x2="150" y2="120" stroke="#000" stroke-width="1"/>
  <text x="132" y="454" text-anchor="end" font-size="8">0</text>
  <text x="132" y="289" text-anchor="end" font-size="8">&#932;<sub>0</sub></text>
  <text x="132" y="124" text-anchor="end" font-size="8">&#932;<sub>max</sub></text>

  <!-- Linear closure-phase trace (empty-home baseline) -->
  <polyline points="150,300 420,180 690,60" fill="none" stroke="#000" stroke-width="1.6"/>
  <text x="600" y="100" text-anchor="start" font-size="9">baseline (empty home)</text>

  <!-- Deviating trace with moving scatterer (wavy deviation) -->
  <path d="M150,310 Q285,340 420,200 T690,90" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="600" y="130" text-anchor="start" font-size="9">with moving scatterer</text>

  <!-- Annotation: slope = path length -->
  <line x1="150" y1="300" x2="420" y2="300" stroke="#000" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="420" y1="300" x2="420" y2="180" stroke="#000" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="440" y="240" text-anchor="start" font-size="9">slope &#8776; loop path length D<sub>loop</sub></text>
</svg>