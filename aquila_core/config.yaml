name: Aquila Core
version: 0.1.1
slug: aquila_core
description: WiFi CSI sensing core for Aquila — DSP, inference, fusion, calibration
url: https://github.com/belikh/aquila
arch:
  - amd64
  - aarch64
image: ghcr.io/belikh/aquila-core-{arch}
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:radar
panel_title: Aquila
panel_admin: true
ports:
  9100/udp: 9100
  9101/udp: 9101
ports_description:
  9100/udp: Raw CSI ingest from nodes (UDP unicast)
  9101/udp: Node control channel (pairing, config, firmware OTA)
options:
  log_level: info
  calibration_profile: default
  # 0 = retain indefinitely. G9 forbids an imposed retention window, so the
  # default is to keep everything; a positive value is an explicit opt-in to
  # automatic expiry.
  retention_days: 0
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  calibration_profile: str
  retention_days: int(0,3650)
